<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writer · local</title>
<style>
:root{--bg:#e8ebef;--card:#eef1f4;--ink:#16191d;--sub:#4c545e;--line:#d3d8df;--sh:6px 6px 16px #cfd4db,-6px -6px 16px #fbfcfd;--sh-s:4px 4px 10px #cfd4db,-4px -4px 10px #fbfcfd;--ok-bg:#d9f0e1;--ok:#0f5c34;--sel:rgba(47,111,237,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#141416;--ink:#f2f2f0;--sub:#a3a39e;--line:#2a2a2d;--sh:0 0 0 1px #242427;--sh-s:0 0 0 1px #2c2c2f;--ok-bg:#123a24;--ok:#8fe0ae;--sel:rgba(47,111,237,.25)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif;height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1fr)}
:focus-visible{outline:2px solid #2f6fed;outline-offset:3px}
aside,section{padding:20px;overflow:auto}aside{border-right:1px solid var(--line)}section+section{border-left:1px solid var(--line)}
h1{font-size:16px;margin:0}p{margin:0}.sub{color:var(--sub);font-size:14px}
button{font:inherit;font-size:14px;font-weight:600;min-height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--card);color:var(--ink);box-shadow:var(--sh-s);cursor:pointer}
button.primary{background:var(--ink);color:var(--bg);box-shadow:none}button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
ul{list-style:none;margin:12px 0 0;padding:0}li button{all:unset;display:block;width:100%;padding:10px 12px;border-radius:6px;cursor:pointer}li button:focus-visible{outline:2px solid #2f6fed}li.on button{background:var(--sel)}
label{display:block;font-size:14px;color:var(--sub);margin-top:12px}input,select,textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:0;border-radius:10px;background:var(--card);color:var(--ink);font:inherit;box-shadow:inset 0 0 0 1px var(--line)}
textarea{height:48vh;font:15px/1.6 ui-monospace,Menlo,monospace;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#preview{margin-top:12px}#preview h1{font-size:28px;margin:0}#status{margin-top:8px;min-height:24px}.ok{color:var(--ok)}code{font:14px ui-monospace,monospace}
#log li{font:14px/1.5 ui-monospace,monospace;color:var(--sub);padding:2px 0}
</style>
</head>
<body>
<aside>
  <h1>Writer · local only</h1>
  <p class="sub">Never deployed. Only the built static pages are pushed.</p>
  <div class="row" role="group" aria-label="Filter"><button data-f="draft" aria-pressed="true">Drafts</button><button data-f="published" aria-pressed="false">Published</button><button id="new">New</button></div>
  <ul id="list"></ul>
  <p class="sub" style="margin-top:24px;font-weight:600">Change log (content/log.jsonl)</p>
  <ul id="log"></ul>
</aside>
<section aria-label="Editor">
  <div class="two"><div><label for="title">Title</label><input id="title"></div><div><label for="slug">Slug (file name)</label><input id="slug" pattern="[a-z0-9-]+"></div></div>
  <div class="two"><div><label for="kind">Kind</label><select id="kind"><option value="written">Written</option><option value="curated">Curated</option></select></div><div><label for="summary">One-line summary</label><input id="summary"></div></div>
  <div class="two" id="cur" hidden><div><label for="link">Link (curated)</label><input id="link" type="url"></div><div><label for="source">Source</label><input id="source"></div></div>
  <label for="body">Markdown</label><textarea id="body"></textarea>
  <div class="row"><button id="save">Save draft</button><button id="pub" class="primary">Publish…</button><button id="build">Build site</button></div>
  <p id="status" class="sub" aria-live="polite"></p>
</section>
<section aria-label="Preview"><p class="sub">Preview</p><div id="preview"></div></section>
<script>
const $ = (id) => document.getElementById(id);
let filter = 'draft', current = null;
const api = async (u, o = {}) => { const r = await fetch(u, { headers: { 'content-type': 'application/json' }, ...o }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };
const say = (t, ok) => { $('status').textContent = t; $('status').className = ok ? 'sub ok' : 'sub'; };
async function refresh() {
  const posts = (await api('/api/posts')).filter((p) => p.status === filter);
  $('list').innerHTML = posts.length ? '' : `<li class="sub" style="padding:10px 12px">${filter === 'draft' ? 'No drafts yet. Press New.' : 'Nothing published yet.'}</li>`;
  for (const p of posts) { const li = document.createElement('li'); if (p.slug === current) li.className = 'on'; const b = document.createElement('button'); b.innerHTML = `<b></b><br><span class="sub"></span>`; b.querySelector('b').textContent = p.title; b.querySelector('span').textContent = `${p.status} · ${p.updated || p.date || ''}`; b.onclick = () => open(p.slug); li.append(b); $('list').append(li); }
  $('log').innerHTML = ''; for (const l of await api('/api/log')) { const li = document.createElement('li'); li.textContent = `${l.t.slice(0, 16).replace('T', ' ')} ${l.act} ${l.slug}`; $('log').append(li); }
}
async function open(slug) { const p = await api('/api/posts/' + slug); current = slug; for (const k of ['title', 'kind', 'summary', 'link', 'source', 'body']) $(k).value = p[k] || ''; $('slug').value = slug; $('slug').disabled = true; $('pub').textContent = p.status === 'published' ? 'Unpublish…' : 'Publish…'; sync(); refresh(); }
function sync() { $('cur').hidden = $('kind').value !== 'curated'; clearTimeout(sync.t); sync.t = setTimeout(async () => { const { html } = await api('/api/preview', { method: 'POST', body: JSON.stringify({ body: $('body').value }) }); $('preview').innerHTML = `<h1></h1>` + html; $('preview').querySelector('h1').textContent = $('title').value; }, 250); }
for (const id of ['title', 'body', 'kind']) $(id).addEventListener('input', sync);
$('title').addEventListener('input', () => { if (!$('slug').disabled) $('slug').value = $('title').value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60); });
$('new').onclick = () => { current = null; for (const k of ['title', 'summary', 'link', 'source', 'body']) $(k).value = ''; $('kind').value = 'written'; $('slug').value = ''; $('slug').disabled = false; $('pub').textContent = 'Publish…'; $('title').focus(); sync(); };
$('save').onclick = async () => { try { const slug = $('slug').value; const p = await api('/api/posts/' + slug, { method: 'PUT', body: JSON.stringify({ title: $('title').value, kind: $('kind').value, summary: $('summary').value, link: $('link').value, source: $('source').value, body: $('body').value }) }); current = p.slug; $('slug').disabled = true; say('Saved as a draft.', true); refresh(); } catch (e) { say(e.message); } };
$('pub').onclick = async () => { if (!current) return say('Save the draft first.'); const unpub = $('pub').textContent.startsWith('Unpublish'); if (!confirm(unpub ? 'Take this post off the site? It stays as a draft.' : 'Publish this post? It appears on the site after the next build and push.')) return; await $('save').onclick(); const p = await api(`/api/posts/${current}/${unpub ? 'unpublish' : 'publish'}`, { method: 'POST' }); $('pub').textContent = p.status === 'published' ? 'Unpublish…' : 'Publish…'; say(p.status === 'published' ? 'Published. Build the site, then commit and push.' : 'Back to draft.', true); refresh(); };
$('build').onclick = async () => { say('Building…'); try { const r = await api('/api/build', { method: 'POST' }); say(r.out, true); } catch (e) { say('Build failed: ' + e.message); } refresh(); };
document.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll('[data-f]').forEach((x) => x.setAttribute('aria-pressed', x === b)); refresh(); });
refresh();
</script>
</body>
</html>
