name: CI and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare error logs
        run: |
          mkdir -p .ci-logs
          : > .ci-logs/npm-ci.log
          : > .ci-logs/lint.log
          : > .ci-logs/build.log

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee .ci-logs/npm-ci.log

      - name: Run lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee .ci-logs/lint.log

      - name: Build application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .ci-logs/build.log

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Create issue for failed CI
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## CI failure"
            echo
            echo "The CI workflow failed for commit ${{ github.sha }} on branch ${{ github.ref_name }}."
            echo
            echo "### Error log"
            echo
            echo '```text'
            cat .ci-logs/npm-ci.log .ci-logs/lint.log .ci-logs/build.log | tail -c 60000
            echo
            echo '```'
            echo
            echo "[View the failed workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > issue-body.md

          gh issue create \
            --title "CI failure on ${{ github.ref_name }} (${{ github.sha }})" \
            --body-file issue-body.md

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
